# install_advntr.cfg
# Configuration file for install_advntr.sh

# Name of the conda environment to create or use
CONDA_ENV="envadvntr"

# Directory where adVNTR will be installed
INSTALL_DIR="$PWD/adVNTR"

# Git repository URL for adVNTR
GIT_REPO="https://github.com/berntpopp/adVNTR.git"

# Git branch to clone. `main` is this fork's default and carries the enhanced_hmm work.
GIT_BRANCH="main"

# Exact revision to check out after cloning.
#
# A branch is mutable, and this one is load-bearing evidence rather than just a version:
# `vntyper/modules/advntr/advntr_genotyping.py` records *why* adVNTR runs at `-t 1` by
# citing exact upstream lines -- `advntr_commands.py:72-74` (`-t` sets only
# `settings.CORES`), `models.py:66,69,72,74` and `vntr_finder.py:870,889` (its only three
# readers, none on VNtyper's path), and `genome_analyzer.py:211`. Those line numbers are
# true of this commit. Without the pin, a later install could fetch a different tree and
# silently invalidate a comment written to stop #215 being re-litigated (#254).
#
# Verified at this revision on 2026-08-12: models.py has exactly four `settings.CORES`
# reads at 66/69/72/74, vntr_finder.py two at 870/889, and genome_analyzer.py contains no
# Process, Pool or Semaphore at all.
GIT_COMMIT="05fd98a4db4ce833546a673be48a7e07a39dd146"
