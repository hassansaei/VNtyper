# install_advntr.cfg
# Configuration file for install_advntr.sh

# Name of the conda environment to create or use
CONDA_ENV="envadvntr"

# Directory where adVNTR will be installed
INSTALL_DIR="$PWD/adVNTR"

# Git repository URL for adVNTR
GIT_REPO="https://github.com/berntpopp/adVNTR.git"

# Git branch to clone. `main` is this fork's default and carries the enhanced_hmm work.
GIT_BRANCH="main"

# Exact revision to check out after cloning.
#
# A branch is mutable, and this pin is load-bearing evidence rather than just a version.
# `vntyper/modules/advntr/advntr_genotyping.py` records that adVNTR's `-t` is REAL from
# 2.0.0 onward, and that claim is only true of this revision onward. Before 2.0.0 `-t`
# set only `settings.CORES`, whose readers were VNTR model construction and two
# PacBio-only functions -- none on VNtyper's `genotype -fs` path (#215, #254).
#
# adVNTR 2.0.0 (tag v2.0.0, commit d66b839) moved the Viterbi DP into a `nogil` block and
# threaded the read loop -- commits f76d326 and 82b1c2b. 2.0.1 is packaging only (it stops
# shipping the test harness in the egg).
#
# 2.0.2 is adversarial-review follow-up: a scoped CI GIL assertion, a Tier 2 preflight, an
# honest Tier 3 baseline stamp, a `writeable = False` flag on the test-only dense-matrix
# accessor, and a 41% cut in peak RSS (1592.9 -> 936.6 MB at `-t 16` on the deepest BAM in
# this corpus) from retaining only the winning traceback rather than both orientations'.
# 2.0.3 is code-review follow-up on 2.0.2 and changes NO executable line under `advntr/`
# or `hmm/` -- its only edit to shipped runtime code is a docstring.
#
# 2.0.4 is why this pin moved, and it is NOT threading work. adVNTR derives its read-fetch
# window from the model's own content: `get_length()` sums the stored repeat units, and
# `vntr_finder.py` used that sum as a genomic end coordinate. Those two quantities agree
# only when the units tile the array end to end exactly once, and the MUC1 hg38 model does
# not -- it stores 840 bp for an array GRCh38 carries at 3,525 bp, so `samfile.fetch`
# covered 24% of the locus (hassansaei/VNtyper#268).
#
# 2.0.4 adds an optional `ref_end` and a `get_genomic_end()` accessor that falls back to
# `start_point + get_length()`, so a model without a recorded end behaves exactly as
# before -- the fallback is the old expression verbatim. Verified: 2.0.4 against the old
# database produces byte-identical VCFs to 2.0.3, and reproduces the published 400-sample
# baseline (132/200 carriers, 68 emitting no state). With the refs-v2 model it detects
# 176/200, at 2.6x wall-clock and 1.3x peak RSS -- the HMM is unchanged, only the number
# of fetched reads grows.
#
# This pin is therefore load-bearing in a second way. refs-v2 ships v2 models in a
# `vntrs_v2` table, which adVNTR 2.0.3 cannot read at all -- deliberately, so an old
# binary fails loudly instead of silently reproducing the truncated window. Downgrading
# this pin below 2.0.4 while `install_references_config.json` points at refs-v2 breaks
# every adVNTR run rather than degrading quietly.
#
# The `-t` claim above still holds: 2.0.4 changes no decoder arithmetic and no threading.
# Tier 1 byte-equivalence against the pristine 05fd98a kernel and the Tier 3 selection
# digest 3d4d3ec6... are unchanged across 2.0.0 through 2.0.4.
#
# Downgrading this pin without also restoring the old `-t` comment would leave VNtyper
# claiming threading it does not get.
GIT_COMMIT="859ad390d463093911d4a4939e143dc57a27fffc"
