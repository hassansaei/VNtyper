# =============================================================================
# VNtyper Docker Compose Configuration
# =============================================================================
# Modern Docker Compose format (version field removed as per 2025 best practices)
# Reference: https://docs.docker.com/compose/compose-file/
#
# REDIS_PASSWORD is required and has no default. Copy .env.example to .env in this
# directory and set it to a freshly generated secret before `docker compose up`;
# `${REDIS_PASSWORD:?...}` below makes compose refuse to start without it.
#
# The Celery broker/backend URL is built by docker/app/celery_app.py from
# REDIS_PASSWORD, which percent-encodes the credential. Do NOT set
# CELERY_BROKER_URL or CELERY_RESULT_BACKEND here: Celery reads those from the
# environment in preference to the URL the application passes it, so they would
# silently replace it.
# =============================================================================

services:
  redis:
    image: redis:7.2-alpine3.19
    container_name: vntyper_redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env - see docker/.env.example}
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck below authenticates
      # without putting the credential on a command line.
      - REDISCLI_AUTH=${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env - see docker/.env.example}
    ports:
      - "6379:6379"
    networks:
      - vntyper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      # Use parent directory as context to access vntyper/ package
      # Security: Sensitive files excluded via .dockerignore in project root
      context: ..
      dockerfile: docker/Dockerfile
    image: vntyper:latest
    container_name: vntyper_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env - see docker/.env.example}
      - MAX_RESULT_AGE_DAYS=7
    volumes:
      - /mnt/c/development/VNtyper/download/:/opt/vntyper/input
      - /mnt/c/development/VNtyper/out/output:/opt/vntyper/output
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vntyper_network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      # Use parent directory as context to access vntyper/ package
      # Security: Sensitive files excluded via .dockerignore in project root
      context: ..
      dockerfile: docker/Dockerfile
    image: vntyper:latest
    container_name: vntyper_worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env - see docker/.env.example}
      - MAX_RESULT_AGE_DAYS=7
    volumes:
      - /mnt/c/development/VNtyper/download/:/opt/vntyper/input
      - /mnt/c/development/VNtyper/out/output:/opt/vntyper/output
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - vntyper_network
    restart: unless-stopped

  beat:
    build:
      # Use parent directory as context to access vntyper/ package
      # Security: Sensitive files excluded via .dockerignore in project root
      context: ..
      dockerfile: docker/Dockerfile
    image: vntyper:latest
    container_name: vntyper_beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env - see docker/.env.example}
      - MAX_RESULT_AGE_DAYS=7
    volumes:
      - /mnt/c/development/VNtyper/download/:/opt/vntyper/input
      - /mnt/c/development/VNtyper/out/output:/opt/vntyper/output
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - vntyper_network
    restart: unless-stopped

networks:
  vntyper_network:
    driver: bridge
