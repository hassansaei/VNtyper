name: CI Tests

# NOTE: no workflow-level `paths:` filter. A workflow skipped by a path filter leaves
# its required status check permanently "Pending" and blocks the merge, whereas a job
# skipped by an `if:` reports "Success". So PR filtering happens per job below, gated
# on the `changes` job, while every main push runs every substantive evidence job.
# `ci-success` remains the aggregate required check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs, but retain each main commit's exact-SHA evidence.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name == 'push' || steps.filter.outputs.python == 'true' }}
      docs: ${{ github.event_name == 'push' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'vntyper/**'
              # The FastAPI + Celery web service. It is not part of the vntyper
              # package, but ruff, mypy and the coverage floor all cover it, so a
              # change here has to run the same gates.
              - 'docker/app/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'Makefile'
              # scripts/ holds the coverage gate and the test-data fetcher; a change
              # to the gate itself must run the tests it gates, or a regression in it
              # merges green with test-unit skipped.
              - 'scripts/**'
              # The image's interpreter and dependency pins are asserted against
              # pyproject by tests/unit/test_version_consistency.py.
              - 'conda/**'
              # Every workflow, not just this one: test_workflow_consistency.py globs
              # the whole directory to check that docker-base.yml and docker-build.yml
              # agree on the base image's hash inputs, so a PR touching only one of
              # those must still run it. Filtering on ci-tests.yml alone meant the
              # guard never ran on the PRs it exists to guard.
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '.github/workflows/ci-tests.yml'

  lint:
    name: Lint (Ruff)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      # Do NOT use `uv pip install --system`: ubuntu-24.04's interpreter is PEP 668
      # "externally managed" and uv refuses it outright. setup-uv already creates and
      # activates a venv when given `python-version`, so normally this only has to put
      # it on PATH for later `make`/`pytest` steps. The fallback covers the case where
      # setup-uv did not create one.
      - name: Ensure the uv environment is on PATH
        run: |
          set -euo pipefail
          if [ -z "${VIRTUAL_ENV:-}" ]; then
            uv venv
            VIRTUAL_ENV="$PWD/.venv"
            echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          fi
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      # Ruff is a standalone binary. This job used to `pip install -e .[dev]`, pulling
      # the full scientific stack (pandas, numpy, matplotlib, plotly, pysam, ...) - 28s
      # of installing to run a 0s lint.
      #
      # Unpinned on purpose: [tool.ruff.lint] uses an explicit `select`, so results are
      # reproducible across ruff versions and CI cannot drift from a developer's local
      # ruff. Going through `make` keeps CI and local scope identical - formatting was
      # previously checked only locally and not gated at all in CI.
      - name: Install ruff
        run: uv pip install ruff

      - run: make lint
      - run: make format-check

  typecheck:
    name: Type Check (mypy)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.10'
          enable-cache: true

      # Do NOT use `uv pip install --system`: ubuntu-24.04's interpreter is PEP 668
      # "externally managed" and uv refuses it outright. setup-uv already creates and
      # activates a venv when given `python-version`, so normally this only has to put
      # it on PATH for later `make`/`pytest` steps. The fallback covers the case where
      # setup-uv did not create one.
      - name: Ensure the uv environment is on PATH
        run: |
          set -euo pipefail
          if [ -z "${VIRTUAL_ENV:-}" ]; then
            uv venv
            VIRTUAL_ENV="$PWD/.venv"
            echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          fi
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      # mypy genuinely needs the runtime deps installed to resolve imports.
      - run: uv pip install -e .[dev]

      # type-check-all, not type-check: the latter is `mypy vntyper/ docker/app/ scripts/`
      # only, so every line under tests/ would remain outside CI's type gate.
      # `type-check-all` adds a second, separate `mypy vntyper/ tests/` invocation -
      # separate on purpose, see the comment on the target in the Makefile.
      - run: make type-check-all

  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    # Pinned rather than ubuntu-latest so a runner-image rollover cannot change the
    # toolchain underneath a green build without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      # fetch-depth: 0, not the default 1. The patch-coverage step below scores the diff
      # against the MERGE BASE with origin/main, and a shallow clone has no merge base to
      # find - `git merge-base` fails and the gate errors out instead of scoring. Full
      # history costs a few seconds on a repo this size.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Do NOT use `uv pip install --system`: ubuntu-24.04's interpreter is PEP 668
      # "externally managed" and uv refuses it outright. setup-uv already creates and
      # activates a venv when given `python-version`, so normally this only has to put
      # it on PATH for later `make`/`pytest` steps. The fallback covers the case where
      # setup-uv did not create one.
      - name: Ensure the uv environment is on PATH
        run: |
          set -euo pipefail
          if [ -z "${VIRTUAL_ENV:-}" ]; then
            uv venv
            VIRTUAL_ENV="$PWD/.venv"
            echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          fi
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e .[dev]

      # Enforces the coverage floor as well as the tests. tests/unit/test_marker_hygiene.py
      # additionally fails the build if any unit test file is missing its `unit` marker.
      - name: Run unit tests with coverage floor
        run: make test-unit-cov

      - name: Check real integration compatibility
        if: matrix.python-version == '3.12'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) BASE_REVISION="origin/$PR_BASE_REF" ;;
            push) BASE_REVISION="$PUSH_BEFORE" ;;
            *) echo "Unsupported compatibility event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [ -z "$BASE_REVISION" ]; then
            echo "Compatibility base revision is empty" >&2
            exit 1
          fi
          make check-integration-compatibility INTEGRATION_COMPAT_BASE="$BASE_REVISION"

      # Patch coverage: at least 80% of the lines THIS PR CHANGED must be covered.
      #
      # This is the step that makes AGENTS.md rule 1 ("touch a file, add tests for it")
      # enforceable. The floor in the previous step is a whole-repo average over ~5000
      # statements: a PR can add a hundred untested lines and move it by less than a
      # point, so it has never once failed a PR for shipping untested code. This one
      # scores the diff and nothing else.
      #
      # It reuses the coverage.xml the step above already wrote, so it costs one
      # `diff-cover` invocation and no second test run.
      #
      # Conditions, both load-bearing:
      #   * pull_request only - a push to main is being compared against itself, so
      #     there is no diff to score.
      #   * one interpreter only - the score is identical on all four, and running it
      #     across the matrix would turn one failure into four identical ones.
      #
      # A PR that only deletes code, only touches docs, or changes no measured Python
      # has no scoreable lines; diff-cover reports "No lines with coverage information"
      # and exits 0. Verified, not assumed.
      - name: Coverage of changed lines (patch coverage)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make patch-coverage PATCH_COVERAGE_BASE="origin/$BASE_REF"

  docs:
    name: Docs build (strict)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      # Do NOT use `uv pip install --system`: ubuntu-24.04's interpreter is PEP 668
      # "externally managed" and uv refuses it outright. setup-uv already creates and
      # activates a venv when given `python-version`, so normally this only has to put
      # it on PATH for later `make`/`pytest` steps. The fallback covers the case where
      # setup-uv did not create one.
      - name: Ensure the uv environment is on PATH
        run: |
          set -euo pipefail
          if [ -z "${VIRTUAL_ENV:-}" ]; then
            uv venv
            VIRTUAL_ENV="$PWD/.venv"
            echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          fi
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e .[docs]

      # docs.yml only builds on push to main, so a PR that breaks `mkdocs --strict`
      # was previously only discovered after merge, when the deploy failed.
      - run: mkdocs build --strict

  ci-success:
    name: CI Success
    # THE required status check. Keep this the only one, so job-level `if:` filtering
    # never leaves a required check pending.
    needs: [changes, lint, typecheck, test-unit, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs succeeded or were legitimately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # A skipped job is acceptable (path filter said it was irrelevant).
          # A failed or cancelled job is not.
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "❌ One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "✅ All CI checks passed"
