[pytest]
# Limit test discovery to tests/ directory only (faster collection)
testpaths = tests

# scripts/ holds the repository's quality-gate instruments. pytest owns this
# session-scoped entry and removes it again when the session ends, so modules using
# these instruments do not need to add another process-global path entry.
pythonpath = scripts

markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    docker: marks tests as Docker container tests (requires Docker daemon)
    browser: needs a real browser engine; excluded from the unit tier
    smoke: fast image structure checks (needs a Docker daemon, but no test data)
    slow: marks tests as slow-running tests (e.g., adVNTR module)
    golden: known-truth simulated benchmark comparisons; deselected collection is safe;
        selected execution requires both VNTYPER_SIM_ROOT and VNTYPER_ADVNTR_ROOT and
        fails without skipping if either root is absent, missing, or incomplete

# Exclude large data directories from test collection (major performance boost)
norecursedirs = download reference references out tmp test testing docker/test_output .git .pytest_cache __pycache__ *.egg-info build dist .tox .nox htmlcov

# ============================================================================
# Live Logging Configuration (shows logs in real-time during test execution)
# ============================================================================
# Enable live logging to CLI (shows logs immediately, not just on failure)
log_cli = true

# Set live logging level (INFO shows progress, DEBUG for more detail)
log_cli_level = INFO

# Format for live logs (includes timestamp and level for better tracking)
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s

# Date format for live logs
log_cli_date_format = %H:%M:%S

# ============================================================================
# File Logging Configuration (for persistent logs)
# ============================================================================
# Also log to file for later analysis
log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ============================================================================
# Captured Log Configuration (for assertions and test validation)
# ============================================================================
# Log level for captured logs (available via caplog fixture)
log_level = DEBUG

# ============================================================================
# Test Timeout Configuration
# ============================================================================
# Timeout for any single test (10 minutes) - prevents stuck tests burning the
# full 6-hour GitHub Actions job limit. pytest-timeout is a pinned dev dependency
# (pyproject.toml), so this needs no extra install.
timeout = 600
timeout_method = thread

# ============================================================================
# Test Output Configuration
# ============================================================================
# Show extra test summary info
console_output_style = progress

# Show durations of slowest tests.
# --durations-min must stay well below 1.0: the whole unit tier runs in ~0.5s, so a
# 1.0s floor hid every duration and made perf regressions invisible.
# --strict-markers turns a typo'd marker into an error instead of a silent deselect.
addopts = --durations=15 --durations-min=0.05 --strict-markers
