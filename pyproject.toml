[build-system]
requires = ["setuptools>=72.2.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vntyper"
dynamic = ["version"]
description = "VNtyper: A tool for genotyping MUC1-VNTR"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Hassan Saei", email = "hassan.saei@inserm.fr"},
    {name = "Bernt Popp", email = "bernt.popp.md@gmail.com"},
]
keywords = ["bioinformatics", "genomics", "VNTR", "MUC1", "genotyping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.0,<2.3.0",
    "numpy>=1.26.0,<2.0.0",
    "regex>=2024.7.24",
    "biopython>=1.84",
    "setuptools>=72.2.0",
    "pysam>=0.22.1",
    "jinja2>=3.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "igv-reports>=1.13.0",
    "plotly>=5.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3.0",  # Prevent stuck tests
    "pytest-xdist>=3.0",  # Parallel test execution (67-81% faster)
    "testcontainers>=4.0.0",  # Docker container testing
    "requests>=2.31.0",  # HTTP library for downloading test data
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "types-requests>=2.0.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10.0",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-macros-plugin>=1.0",
]

[project.urls]
Homepage = "https://github.com/hassansaei/vntyper"
Repository = "https://github.com/hassansaei/vntyper"
Issues = "https://github.com/hassansaei/vntyper/issues"
Documentation = "https://hassansaei.github.io/VNtyper/"

[project.scripts]
vntyper = "vntyper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vntyper*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "vntyper.version.__version__"}

[tool.setuptools.package-data]
"vntyper.scripts" = [
    "kestrel_config.json",
    "install_references_config.json",
    "report_config.json",
]
"vntyper" = [
    "config.json",
    "templates/report_template.html",
    "templates/cohort_summary_template.html",
    "dependencies/kestrel/*.jar",
    "modules/shark/shark_config.json",
    "modules/advntr/advntr_config.json",
]

# ===========================
# Ruff Configuration
# ===========================
[tool.ruff]
# Same line length as previous .flake8 config
line-length = 120
indent-width = 4

# Target Python 3.9 (minimum supported version)
target-version = "py39"

# Exclude common directories
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Use an explicit `select`, NOT `extend-select`. `extend-select` builds on ruff's
# default rule set, which ruff is free to change between releases - ruff 0.16
# expanded its defaults and turned ~440 unrequested rules on at once, taking CI from
# green to 740 errors without a single line of code changing. Listing rules
# explicitly makes lint results reproducible across ruff versions.
select = [
    # --- ruff's historical defaults, now pinned explicitly ---
    "E4",   # pycodestyle: imports
    "E7",   # pycodestyle: statements
    "E9",   # pycodestyle: runtime errors
    "F",    # pyflakes
    # --- long-standing project opt-ins ---
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (detect common bugs)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "SIM",  # flake8-simplify (simplify code)
    # --- adopted when ruff 0.16 surfaced them; the code now satisfies these ---
    "LOG",  # flake8-logging: no calls on the root logger
    "DTZ",  # flake8-datetimez: no naive/deprecated datetime calls
    "EXE",  # flake8-executable: no shebangs on non-executable modules
    "FA",   # flake8-future-annotations
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PERF", # perflint
    "FURB", # refurb
    "G201",    # .exception() over .error(..., exc_info=True)
    "TRY201",  # bare `raise` when re-raising
    "TRY401",  # redundant exception object in .exception()
    "PLW0602", # `global` without assignment
    "PLW1510", # subprocess.run without explicit check=
]

# Note: E501 (line too long) is automatically ignored when the formatter is enabled.
ignore = [
    "D100", "D104",  # Missing docstrings (enable later if desired)
    "D200", "D202", "D205", "D400", "D401",  # Docstring formatting
    # Deliberate, not accidental:
    "PERF203",  # try/except inside a loop - the pipeline needs per-iteration
                # error handling so one bad sample cannot abort a whole cohort.
]

# Rules deliberately NOT selected, so the omission is a decision and not an oversight:
#   BLE001 (blind-except) - `except Exception` at stage and process boundaries is the
#     project's intended error-handling contract (log, then exit 1). Narrowing all 46
#     handlers needs per-call knowledge of what each external tool raises.
#   G004 (logging-f-string) - f-strings in log calls are the established style across
#     all ~600 log statements.

# Allow auto-fix for all rules by default
fixable = ["ALL"]
unfixable = []

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # Allow unused imports
"tests/**/*.py" = ["S101"]        # Allow assert statements in tests

# ===========================
# mypy Configuration
# ===========================
# Previously passed as CLI flags from three separate Makefile targets, which drifted:
# they hardcoded `--python-version 3.9`, and mypy 2.x dropped support for targeting
# 3.9 ("must be 3.10 or higher"), breaking CI. Configure it once here instead.
[tool.mypy]
# The runtime floor stays 3.9 (see `requires-python` and the CI matrix); this is only
# the version mypy type-checks against, and 3.10 is the oldest it still supports.
# Ruff's `target-version = "py39"` remains the guard against 3.10+ syntax.
python_version = "3.10"
ignore_missing_imports = true

# ===========================
# Coverage Configuration
# ===========================
[tool.coverage.run]
# `source` must live here rather than on the CLI for relative_files to work.
source = ["vntyper"]
relative_files = true

[tool.coverage.report]
show_missing = true
# HARD FLOOR - CI fails below this. It is a RATCHET: raise it whenever measured
# coverage climbs, never lower it to make a build pass. `make test-unit-cov` prints
# the exact line to change when the floor is out of date.
#
# The TARGET is 80% (COVERAGE_TARGET in the Makefile). Falling short of the target is
# a warning, not a failure - see scripts/coverage_gate.py. The gap is deliberate: the
# six modules over 650 LOC sit at 0-28% coverage and have to be split before they can
# realistically be tested (see "Changing existing code" in AGENTS.md).
fail_under = 25
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff.format]
# Use double quotes (Python default)
quote-style = "double"

# Use spaces (not tabs)
indent-style = "space"

# Auto-detect line endings
line-ending = "auto"

# Format code examples in docstrings
docstring-code-format = true
docstring-code-line-length = 100

# ===========================
# Pytest Configuration
# ===========================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "docker: Docker container tests (requires Docker daemon)",
    "slow: Slow-running tests (e.g., adVNTR module)",
]
addopts = "-v --tb=short"
