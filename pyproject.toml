[build-system]
requires = ["setuptools>=72.2.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vntyper"
dynamic = ["version"]
description = "VNtyper: A tool for genotyping MUC1-VNTR"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Hassan Saei", email = "hassan.saei@inserm.fr"},
    {name = "Bernt Popp", email = "bernt.popp.md@gmail.com"},
]
keywords = ["bioinformatics", "genomics", "VNTR", "MUC1", "genotyping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.0,<2.3.0",
    "numpy>=1.26.0",
    "regex>=2024.7.24",
    "biopython>=1.84",
    "setuptools>=72.2.0",
    "pysam>=0.22.1",
    "jinja2>=3.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "igv-reports>=1.13.0",
    "plotly>=5.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3.0",  # Prevent stuck tests
    "pytest-xdist>=3.0",  # Parallel test execution (67-81% faster)
    # Python 3.10 has no stdlib tomllib; the BLE001 policy guard uses this only
    # while running the unit tier, so it belongs in the test-only extra.
    "tomli>=2.0.1; python_version < '3.11'",
    "testcontainers>=4.0.0",  # Docker container testing
    "requests>=2.31.0",  # HTTP library for downloading test data
    # Scores coverage of CHANGED lines only (`make patch-coverage`, gated at 80% in CI).
    # Lower-bounded rather than pinned: the gate reads our own coverage.xml and the
    # number it computes does not depend on the tool version.
    "diff-cover>=9.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "types-requests>=2.0.0",
    # tests/unit/test_integration_tier_hygiene.py parses the workflow files rather
    # than grepping them, so the tier that must run on a fresh clone needs a YAML
    # parser. It arrives transitively today (igv-reports requires it); declared
    # here so the unit tier does not depend on a runtime dependency's own tree.
    "pyyaml>=6.0",
    # docker/app (FastAPI + Celery web service) deps. None of these ship with the
    # vntyper package; docker/app itself is installed from
    # docker/requirements-web.txt, not from this project.
    #
    # Pinned, not lower-bounded, and pinned to exactly what
    # docker/requirements-web.txt installs: the tests under tests/unit/web/ run
    # against these, so a lower bound would let the tier resolve a newer framework
    # than the image ever runs and pass against a stack nobody deploys.
    # tests/unit/test_version_consistency.py fails the build when this list and
    # requirements-web.txt disagree. requirements-web.txt is an input to the base
    # image's content hash (AGENTS.md trap 10), so it is the fixed side: change
    # versions there first, then mirror them here.
    "fastapi[standard]==0.115.3",
    "uvicorn[standard]==0.32.0",
    "redis==5.2.0",
    "celery==5.4.0",
    "python-multipart==0.0.31",
    # 0.2.0 removed the `FastAPILimiter` class docker/app imports
    # (`from fastapi_limiter import FastAPILimiter`).
    "fastapi-limiter==0.1.6",
    "email_validator==2.2.0",
    "bcrypt==5.0.0",
    "pydantic==2.10.0",
    # The one deliberate exception to the mirror above: test-only, so the image
    # has no reason to carry it and requirements-web.txt does not list it.
    "fakeredis>=2.21",  # pure-Python Redis stand-in, unit-tier only
]
web = [
    # Mirrors docker/requirements-web.txt exactly, pin for pin. That file is the
    # source of truth for what the Docker image installs; this group exists so
    # `pip install .[web]` can run docker/app outside the container against the
    # same versions. The image itself still installs from requirements-web.txt
    # directly, and tests/unit/test_version_consistency.py fails the build if the
    # two ever drift apart.
    "fastapi[standard]==0.115.3",
    "uvicorn[standard]==0.32.0",
    "redis==5.2.0",
    "celery==5.4.0",
    "python-multipart==0.0.31",
    "fastapi-limiter==0.1.6",
    "email_validator==2.2.0",
    "bcrypt==5.0.0",
    "pydantic==2.10.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10.0",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-macros-plugin>=1.0",
]

[project.urls]
Homepage = "https://github.com/hassansaei/vntyper"
Repository = "https://github.com/hassansaei/vntyper"
Issues = "https://github.com/hassansaei/vntyper/issues"
Documentation = "https://hassansaei.github.io/VNtyper/"

[project.scripts]
vntyper = "vntyper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vntyper*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "vntyper.version.__version__"}

[tool.setuptools.package-data]
"vntyper.scripts" = [
    "kestrel_config.json",
    "install_references_config.json",
    "report_config.json",
    "calibration.json",
]
"vntyper" = [
    "config.json",
    "templates/report_template.html",
    "templates/cohort_summary_template.html",
    "dependencies/kestrel/*.jar",
    "modules/shark/shark_config.json",
    "modules/advntr/advntr_config.json",
]

# ===========================
# Ruff Configuration
# ===========================
[tool.ruff]
# Same line length as previous .flake8 config
line-length = 120
indent-width = 4

# Target Python 3.10 (minimum supported version; 3.9 is EOL since 2025-10-31)
target-version = "py310"

# Pin which files ruff discovers, for the same reason `[tool.ruff.lint]` below pins
# `select` instead of using `extend-select`: ruff's defaults move between releases, and a
# widened default silently changes what the gate means without a line of code changing.
#
# Ruff 0.16 began formatting Python fenced inside Markdown. Nothing asked it to, and the
# result was a repository where `make format-check` passed while `ruff format --check .`
# reported four files - `docs/development/ci-followups.md`, `reference/README.md`,
# `reference/generate_vntr_reference.py` and a design document (then under a top-level
# `specs/`, since untracked). That is a trap for anyone who runs the obvious command
# instead of the Makefile target, and it cannot be resolved by reformatting: `reference/`
# is a base-image content-hash input (see `exclude` below), and rewriting a committed
# design document to satisfy a formatter is churn.
#
# What this line gives up, stated rather than hidden: the Markdown files under
# `RUFF_PATHS` are no longer formatted, though 0.16 had started doing it. Measure the
# scope by re-running the check with `*.md` appended to this list and subtracting the
# `.py`-only total - it was 45 Markdown files against 184 `.py` files when `docs/` was
# added to `RUFF_PATHS`, and both figures move with every merge. Prose here is gated by
# `mkdocs build --strict`, not by ruff. No `.py` file is affected either way. Widening
# this to prose is a deliberate change to this line and to `RUFF_PATHS` together, not
# something to inherit from a release note.
#
# `RUFF_PATHS` is `vntyper/ docker/app/ tests/ scripts/ docs/`, chosen so that it and a
# bare `.` discover the identical set of files. Keep them equal - a target that passes
# while the bare command reports a finding is the trap this `include` line was added to
# remove, and it had reopened via `docs/hooks.py`. The Makefile comment above
# `RUFF_PATHS` gives the one-line command that checks it.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

# Exclude common directories
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    # `reference/` is no longer a base-image content-hash input (AGENTS.md trap 10) - all
    # reference data now comes from berntpopp/vntyper-data, and the directory holds only
    # `README.md`, `pseudonymize.py` and `pseudonymize_config.json`. It stays excluded
    # here for a narrower reason: it is not in `RUFF_PATHS` (`vntyper/ docker/app/ tests/
    # scripts/ docs/`), and the Makefile's INVARIANT comment above `RUFF_PATHS` requires
    # that variable to cover exactly what a bare `ruff .` discovers on its own. Removing
    # this line would let `pseudonymize.py` back into that bare-command scan without
    # adding it to `RUFF_PATHS`, reopening the green-CI/red-local trap `RUFF_PATHS` exists
    # to close.
    "reference",
]

[tool.ruff.lint]
# Use an explicit `select`, NOT `extend-select`. `extend-select` builds on ruff's
# default rule set, which ruff is free to change between releases - ruff 0.16
# expanded its defaults and turned ~440 unrequested rules on at once, taking CI from
# green to 740 errors without a single line of code changing. Listing rules
# explicitly makes lint results reproducible across ruff versions.
select = [
    # --- ruff's historical defaults, now pinned explicitly ---
    "E4",   # pycodestyle: imports
    "E7",   # pycodestyle: statements
    "E9",   # pycodestyle: runtime errors
    "F",    # pyflakes
    # --- long-standing project opt-ins ---
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear (detect common bugs)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "SIM",  # flake8-simplify (simplify code)
    # --- adopted when ruff 0.16 surfaced them; the code now satisfies these ---
    "LOG",  # flake8-logging: no calls on the root logger
    "DTZ",  # flake8-datetimez: no naive/deprecated datetime calls
    "EXE",  # flake8-executable: no shebangs on non-executable modules
    "FA",   # flake8-future-annotations
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PERF", # perflint
    "FURB", # refurb
    "G201",    # .exception() over .error(..., exc_info=True)
    "TRY201",  # bare `raise` when re-raising
    "TRY401",  # redundant exception object in .exception()
    "PLW0602", # `global` without assignment
    "PLW1510", # subprocess.run without explicit check=
]

# Note: E501 (line too long) is automatically ignored when the formatter is enabled.
ignore = [
    "D100", "D104",  # Missing docstrings (enable later if desired)
    "D200", "D202", "D205", "D400", "D401",  # Docstring formatting
    # Deliberate, not accidental:
    "PERF203",  # try/except inside a loop - the pipeline needs per-iteration
                # error handling so one bad sample cannot abort a whole cohort.
]

# Rules deliberately NOT selected, so the omission is a decision and not an oversight:
#   BLE001 (blind-except) - deliberately unselected. The reviewed Ruff 0.14.3 baseline
#     is 103 normal diagnostics and 108 including five explicit suppressions. Final
#     no-cache measurement under actual Ruff 0.16.1 matched the same 103/108 pair. The
#     executable inventory and equality guard are scripts/ble001_policy.json plus
#     tests/unit/test_ble001_policy.py; not every handler is a process boundary.
#   G004 (logging-f-string) - f-strings in log calls are the established style across
#     all ~600 log statements.

# Allow auto-fix for all rules by default
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-bugbear]
# B008 exists to catch a *mutable* default that is built once at def time and then
# shared by every call. FastAPI's parameter markers are not that: `File(...)` and
# `Form(...)` return immutable `FieldInfo` descriptors that FastAPI reads out of the
# signature and replaces with the parsed request value, so the function body never
# sees the marker object at all. Ruff already hardcodes `fastapi.Depends` and
# `fastapi.Query` as immutable for this reason; `File`, `Form`, `Body`, `Header`,
# `Cookie` and `Path` are the same kind of object and the omission is a gap in that
# list, not a defect in `docker/app`. B008 stays on for every genuinely mutable
# default in both `vntyper/` and `docker/app/`.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # Allow unused imports
"tests/**/*.py" = ["S101"]        # Allow assert statements in tests

# ===========================
# mypy Configuration
# ===========================
# Previously passed as CLI flags from three separate Makefile targets, which drifted:
# they hardcoded `--python-version 3.9`, and mypy 2.x dropped support for targeting
# 3.9 ("must be 3.10 or higher"), breaking CI. Configure it once here instead.
[tool.mypy]
# Matches `requires-python` and ruff's `target-version`; 3.10 is also the oldest
# version mypy still supports targeting.
python_version = "3.10"
ignore_missing_imports = true

# `mypy vntyper/ docker/app/` needs no search path of its own: `docker/app/__init__.py`
# exists and `docker/__init__.py` does not, so mypy walks up exactly one level, roots
# the package at `docker/` and names the modules `app.*` on its own - which is both how
# the intra-package imports resolve and why the `app.*` override below matches.
#
# `mypy_path` is set for the *other* invocation. `make type-check-all` also runs
# `mypy vntyper/ tests/`, where the `from app import ...` lines in `tests/unit/web/`
# have no such anchor: without this they resolve to `Any` under
# `ignore_missing_imports`, and a whole suite is type-checked against a web service
# whose every symbol is untyped. With it, those tests are checked against the real
# signatures (#194).
#
# Turning it on cost 23 errors in 3 files, all of them fixed at the source rather than
# silenced. None was a behavioural defect; each was a stand-in nominally narrower than
# the callable it stands in for, which a contravariant parameter refuses:
#
#   * 17 in `test_request_size_limit.py`, whose hand-rolled ASGI doubles were annotated
#     `dict[str, Any]` where `request_limits` and Starlette both publish
#     `MutableMapping[str, Any]`. Fixed by widening the doubles to the contract they
#     stand in for. `request_limits` itself is unchanged: narrowing its aliases to the
#     `dict` the ASGI specification names would make the middleware unusable through
#     `Starlette.add_middleware`.
#   * 1 in `test_upload_limits.py`, whose `RecordingSource` implements `read` and
#     nothing else. Fixed on the production side, where the over-broad declaration was:
#     `save_upload_bounded` now takes a `uploads.ByteSource` protocol naming the one
#     method it calls, rather than the whole of `BinaryIO`.
#   * 4 from `create_cohort_record` returning `dict[str, str | None]`, so
#     `created["cohort_id"]` typed as `str | None` even though that key is always a
#     `str`. `cohorts.CohortRecord`, a `TypedDict`, fixes all four at the source.
#   * 1 real finding in a test, fixed earlier under the same investigation:
#     `test_credentials_and_disclosure.py` passed `urlsplit(...).password` - a
#     `str | None` - straight into `unquote()`.
#
# The two invocations stay separate even so, because each suite is then checked against
# the same scope CI checks it against; see the comment on the `type-check-all` target.
mypy_path = "docker"

# Staged strictness for the web service.
#
# NOTE: the global section above deliberately enables neither `disallow_untyped_defs`
# nor `disallow_incomplete_defs`, so both are already off everywhere and this section
# changes nothing today. It is written out all the same: it is the anchor for the
# decision, and it holds `docker/app` at today's level if the global settings are
# tightened for `vntyper/` later. `docker/app` is a large, largely unannotated FastAPI
# service - running mypy relaxed catches real type bugs now, while running it strict
# produces a backlog that gets silenced with `# type: ignore` rather than fixed.
# Tighten as annotations land.
[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ===========================
# Coverage Configuration
# ===========================
[tool.coverage.run]
# `source` must live here rather than on the CLI for relative_files to work.
#
# `docker/app` is the FastAPI + Celery web service and root `scripts` contains the
# project's validation instruments. Neither is an installed package, so both are listed
# as directory paths rather than importable names; coverage measures them by file location
# either way, and `relative_files` keeps the reported paths anchored to the repo root so
# the same data file reads identically in CI and locally.
source = ["vntyper", "docker/app", "scripts"]
relative_files = true

# Branch coverage. An `if` that is entered but never taken is not "covered" for
# a codebase whose failure mode is silently taking the wrong branch. Enabled in
# #196 once the branch-inclusive total cleared the floor; the floor below is the
# branch-inclusive figure and was never lowered to admit this measurement.
branch = true

[tool.coverage.report]
show_missing = true
# HARD FLOOR - CI fails below this. It is a RATCHET: raise it whenever measured
# coverage climbs, never lower it to make a build pass. `make test-unit-cov` prints
# the exact line to change when the floor is out of date.
#
# NOTE: BOTH `coverage report --format=total` AND pytest-cov's terminal TOTAL column
# ROUND to an integer - a true 34.98% displays as 35%. Setting this floor from either
# of those numbers makes CI fail on the very run that produced it. Take the value
# `make test-unit-cov` prints instead: scripts/coverage_gate.py reports the precise
# figure and states the exact line to paste here.
#
# The historical 80 floor was BRANCH-INCLUSIVE. `branch = true` above was enabled in
# #196, which raised the floor from 70 to the 74.22% that run measured; splitting
# cohort_summary.py into five
# focused modules (Task 22 of the #181-#197 follow-ups) took the same suite to 79.02%,
# and the fixes and tests of the gated phase took it to 80.24%. The floor moved with
# each. It has never been lowered to admit a measurement.
#
# 80.24% also met the then-current project target for the first time. The target remains
# a warning while the floor is a gate: they measure the same figure for different
# purposes and must not be collapsed into one setting.
# Statement-only coverage of the same suite is 80.77%, so the two are not
# interchangeable and deleting `branch = true` would RAISE the reported total past this
# floor while covering strictly less. tests/unit/test_coverage_gate.py pins both.
#
# The TARGET is 86% (COVERAGE_TARGET in the Makefile). Falling short of the target is
# a warning, not a failure - see scripts/coverage_gate.py.
#
# Four modules remain over the 650-LOC limit, measured at ec67fff:
# docker/app/main.py (1151, 88.77%), install_references.py (901, 26.04%),
# kestrel_genotyping.py (877, 51.67%) and pipeline.py (721, 68.48%).
#
# Size alone does not predict coverage, and this comment previously implied it did.
# main.py is the largest file in the repository and one of the best covered; only
# install_references.py still fits the old "oversized therefore untested" rule. What
# predicts coverage here is coupling to I/O -- a function that cannot be called without
# a filesystem does not get a unit test, whatever its file's length. See "Changing
# existing code" in AGENTS.md, which carries the same table and the same argument.
#
# These percentages are a snapshot taken at the commit named above, not a live claim.
# An earlier revision of this comment quoted kestrel_genotyping.py at 843 LOC / 41.9%,
# figures already one commit stale when they were written.
fail_under = 86
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff.format]
# Use double quotes (Python default)
quote-style = "double"

# Use spaces (not tabs)
indent-style = "space"

# Auto-detect line endings
line-ending = "auto"

# Format code examples in docstrings
docstring-code-format = true
docstring-code-line-length = 100
